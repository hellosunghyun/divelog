name = "divelog"
account_id = "affecc6aaec94a3ab40da3da7a7ef1af"
main = "workers/app.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "divelog.ada-kr-pos.com", custom_domain = true }
]

[vars]
ADMIN_USER_ID = "usr_placeholder_replace_with_real_admin_id"
ADMIN_EMAILS = "sunkima26@pos.idserve.net"
LOG_LEVEL = "INFO"

[assets]
directory = "./build/client"

[[d1_databases]]
binding = "DB"
database_name = "divelog-db"
database_id = "12a8007b-d92c-45cf-8bab-2d5692d704c1"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "divelog-r2"

[[queues.producers]]
binding = "QUEUE"
queue = "divelog-queue"

[[queues.consumers]]
queue = "divelog-queue"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
