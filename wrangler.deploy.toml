name = "divelog"
main = "build/server/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "divelog.ada-kr-pos.com", custom_domain = true }
]

[assets]
directory = "build/client"

[[d1_databases]]
binding = "DB"
database_name = "divelog-db"
database_id = "12a8007b-d92c-45cf-8bab-2d5692d704c1"

[[r2_buckets]]
binding = "R2"
bucket_name = "divelog-r2"

[[queues.producers]]
binding = "QUEUE"
queue = "divelog-queue"
